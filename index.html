  <style>
     

            
        .container {
            background-color: #322c52;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(59, 47, 47, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
       

        h1 {
            color: #ffffff;
            margin-bottom: 20px;
        }

        .upload-section {
            margin-bottom: 20px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            border: 1px solid #ffffff;
            background-color: #ffffff;
            color: #333;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .file-input-wrapper:hover {
            background-color: #ddd;
        }

        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            font-size: 100px;
            cursor: pointer;
        }

        #file-name {
            margin-top: 10px;
            font-size: 0.9em;
            color: #ffffff;
        }
        
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        label {
            margin-right: 10px;
            color: #ffffff;
        }

        input[type="range"] {
            width: 60%;
        }

        .player-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background-color: #0056b3;
        }

        #output-audio-container {
            margin-top: 20px;
            text-align: center;
        }

        #output-audio {
            width: 100%; /* Make audio player responsive */
            max-width: 400px;
        }
        
    </style>
<body>
    <div class="container">
        <h1>Slowed + Reverb Player</h1>

        <div class="upload-section">
            <label class="file-input-wrapper">
                Choose Audio File
                <input type="file" class="file-input" id="audioFile" accept="audio/*">
            </label>
            <div id="file-name">No file chosen</div>
        </div>

        <div class="controls-section">
            <div class="control-item">
                <label for="slowdown">Slowdown:</label>
                <input type="range" id="slowdown" min="0.5" max="1.5" step="0.05" value="1">
                <span id="slowdown-value">1x</span>
            </div>
            <div class="control-item">
                <label for="reverb">Reverb:</label>
                <input type="range" id="reverb" min="0" max="1" step="0.05" value="0.2">
                <span id="reverb-value">20%</span>
            </div>
        </div>

        <div class="player-controls">
            <button id="playButton" disabled>Play</button>
            <button id="stopButton" disabled>Stop</button>
        </div>

        <div id="output-audio-container">
            <audio id="output-audio" controls style="display: none;"></audio>
            <p id="processing-message" style="display: none;">Processing audio...</p>
            <p id="error-message" style="color: red; display: none;">Error processing audio.</p>
        </div>
        <div class="player-container">
    <div id="song-selection-menu">
        <h3>Choose a Sample Track (Optional)</h3>
        <select id="track-selector">
            <option value="none" selected>-- Select from Library --</option>
            <option value="path/to/track1.mp3">Sample Track 1 - ALL Jmilton TYPE PHONK MASHUPS (MEGA MASHUP)</option>
            <option value="path/to/track2.mp3">Sample Track 2 - MENTE MÁ</option>
            <option value="path/to/track3.mp3">Sample Track 3 - NO ERA AMOR (Super Slowed)</option>
        </select>
        <button id="load-sample-btn">Load Track</button>
       
    </div>

    
    
    </div>
    </div>

    <script>
        const audioFile = document.getElementById('audioFile');
        const fileNameDisplay = document.getElementById('file-name');
        const slowdownSlider = document.getElementById('slowdown');
        const slowdownValueDisplay = document.getElementById('slowdown-value');
        const reverbSlider = document.getElementById('reverb');
        const reverbValueDisplay = document.getElementById('reverb-value');
        const playButton = document.getElementById('playButton');
        const stopButton = document.getElementById('stopButton');
        const outputAudioElement = document.getElementById('output-audio');
        const processingMessage = document.getElementById('processing-message');
        const errorMessage = document.getElementById('error-message');
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffer = null;
        let sourceNode = null;

        audioFile.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                fileNameDisplay.textContent = 'Selected file: ' + this.files[0].name;
                const file = this.files[0];
                const reader = new FileReader();

                reader.onload = function(e) {
                    audioContext.decodeAudioData(e.target.result)
                        .then(buffer => {
                            audioBuffer = buffer;
                            playButton.disabled = false;
                        })
                        .catch(error => {
                            console.error("Error decoding audio data:", error);
                            errorMessage.style.display = 'block';
                            processingMessage.style.display = 'none';
                            playButton.disabled = true;
                            stopButton.disabled = true;
                        });
                    processingMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    stopButton.disabled = true;
                    outputAudioElement.style.display = 'none';
                };
                reader.onerror = function() {
                    console.error("Error reading the audio file.");
                    errorMessage.style.display = 'block';
                    processingMessage.style.display = 'none';
                    playButton.disabled = true;
                    stopButton.disabled = true;
                    outputAudioElement.style.display = 'none';
                };
                reader.readAsArrayBuffer(file);
            } else {
                fileNameDisplay.textContent = 'No file chosen';
                audioBuffer = null;
                playButton.disabled = true;
                stopButton.disabled = true;
                outputAudioElement.style.display = 'none';
                processingMessage.style.display = 'none';
                errorMessage.style.display = 'none';
            }
        });

        slowdownSlider.addEventListener('input', function() {
            slowdownValueDisplay.textContent = this.value + 'x';
            if (sourceNode) {
                sourceNode.playbackRate.value = parseFloat(this.value);
            }
        });

        reverbSlider.addEventListener('input', function() {
            reverbValueDisplay.textContent = Math.round(this.value * 100) + '%';
            // Implementing reverb with Web Audio API requires a ConvolverNode
            // and an impulse response. This is a more advanced topic.
            // For simplicity, we are not implementing actual reverb here.
            // In a real application, you would create a ConvolverNode,
            // load an impulse response, and connect it in the audio graph.
        });

        playButton.addEventListener('click', function() {
            if (audioBuffer) {
                if (sourceNode) {
                    sourceNode.stop(); // Stop any previous playback
                }
                sourceNode = audioContext.createBufferSource();
                sourceNode.buffer = audioBuffer;
                sourceNode.connect(audioContext.destination);
                sourceNode.playbackRate.value = parseFloat(slowdownSlider.value);
                sourceNode.start(0);
                stopButton.disabled = false;
                outputAudioElement.style.display = 'none'; // Hide default audio player
            }
        });

        stopButton.addEventListener('click', function() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode = null;
            }
        });
    </script>
